fragment basicArtefactFields on ExportArtifact {
  _id
  kind
  format
  status
  storageKey
  mimeType
  size
  presignedUrl
  createdAt
}

fragment basicPipelineJobFields on PipelineJob {
  _id
  type
  status
  progress
  remoteJobId
  logsTail
  error
  startedAt
  finishedAt
  createdAt
  updatedAt
  artefacts {
    ...basicArtefactFields
  }
}

query getPipelineHealth {
  pipelineHealth {
    ok
    httpStatus
    pandoc
    chromium
    storage
    node
    error
  }
}

query getPipelineJob($id: ID!) {
  pipelineJob(id: $id) {
    ...basicPipelineJobFields
  }
}

query getPipelineJobs($corpusId: ID, $limit: Int) {
  pipelineJobs(corpusId: $corpusId, limit: $limit) {
    ...basicPipelineJobFields
  }
}

query getCorpusArtefactSummary($corpusId: ID, $limit: Int = 50) {
  pipelineJobs(corpusId: $corpusId, limit: $limit) {
    _id
    type
    status
    finishedAt
    artefacts {
      _id
      kind
      format
      status
    }
  }
}

mutation startBuildArticle(
  $articleId: ID!
  $corpusId: ID!
  $engine: PdfEngine = paged
) {
  startBuildArticle(articleId: $articleId, corpusId: $corpusId, engine: $engine) {
    ...basicPipelineJobFields
  }
}

mutation cancelPipelineJob($id: ID!) {
  cancelPipelineJob(id: $id) {
    ...basicPipelineJobFields
  }
}

mutation startBatchBuild($corpusId: ID!, $engine: PdfEngine = paged) {
  startBatchBuild(corpusId: $corpusId, engine: $engine) {
    ...basicPipelineJobFields
  }
}

mutation startBuildCovers($corpusId: ID!) {
  startBuildCovers(corpusId: $corpusId) {
    ...basicPipelineJobFields
  }
}

mutation startBuildToc($corpusId: ID!) {
  startBuildToc(corpusId: $corpusId) {
    ...basicPipelineJobFields
  }
}

mutation startBuildFrontPage($corpusId: ID!) {
  startBuildFrontPage(corpusId: $corpusId) {
    ...basicPipelineJobFields
  }
}

mutation startBuildCompleteIssue($corpusId: ID!) {
  startBuildCompleteIssue(corpusId: $corpusId) {
    ...basicPipelineJobFields
  }
}

mutation syncArticleYaml($articleId: ID!, $corpusId: ID) {
  syncArticleYaml(articleId: $articleId, corpusId: $corpusId) {
    articleId
    corpusId
    yaml
    markdown
  }
}

mutation startPageNumberSync($corpusId: ID!, $startPage: Int = 1) {
  startPageNumberSync(corpusId: $corpusId, startPage: $startPage) {
    ...basicPipelineJobFields
  }
}

mutation applyPageNumbers($input: ApplyPageNumbersInput!) {
  applyPageNumbers(input: $input) {
    applied
    entries {
      articleId
      startPage
      pageCount
    }
  }
}

mutation pushPageNumbersToOJS(
  $instance: OjsInstance!
  $entries: [OjsPushPageNumberEntry!]!
  $apply: Boolean = false
) {
  pushPageNumbersToOJS(instance: $instance, entries: $entries, apply: $apply) {
    applied
    dryRun
    items
  }
}

mutation pushDoisToOJS(
  $instance: OjsInstance!
  $entries: [OjsPushDoiEntry!]!
  $apply: Boolean = false
) {
  pushDoisToOJS(instance: $instance, entries: $entries, apply: $apply) {
    applied
    dryRun
    items
  }
}

mutation pushAuthorBiosToOJS(
  $instance: OjsInstance!
  $entries: [OjsPushBioEntry!]!
  $apply: Boolean = false
) {
  pushAuthorBiosToOJS(instance: $instance, entries: $entries, apply: $apply) {
    applied
    dryRun
    items
  }
}

query getCorpusIssueMetadata($corpusId: ID!) {
  corpus: sharedCorpus(corpusId: $corpusId) {
    _id
    name
    type
    editors {
      familyName
      givenName
      email
      ORCID
      affiliation
      bio
    }
    imageCredit
    pipelineSettings {
      templateId
      cssOverrideRef
      ojsTargetId
      staticDeployTargetId
      princeEnabled
    }
  }
}

mutation updateCorpusIssueMetadata(
  $corpusId: ID!
  $input: UpdateCorpusIssueMetadataInput!
) {
  corpus(corpusId: $corpusId) {
    updateIssueMetadata(input: $input) {
      _id
      editors {
        familyName
        givenName
        email
        ORCID
        affiliation
        bio
      }
      imageCredit
    }
  }
}

mutation updateCorpusPipelineSettings(
  $corpusId: ID!
  $input: CorpusPipelineSettingsInput!
) {
  corpus(corpusId: $corpusId) {
    updatePipelineSettings(input: $input) {
      _id
      pipelineSettings {
        templateId
        cssOverrideRef
        ojsTargetId
        staticDeployTargetId
        princeEnabled
      }
    }
  }
}

mutation uploadCorpusTemplateOverride(
  $corpusId: ID!
  $kind: CorpusTemplateOverrideKind!
  $filename: String!
  $contentBase64: String!
) {
  uploadCorpusTemplateOverride(
    corpusId: $corpusId
    kind: $kind
    filename: $filename
    contentBase64: $contentBase64
  ) {
    corpusId
    kind
    storageKey
    size
    presignedUrl
  }
}

mutation clearCorpusTemplateOverride(
  $corpusId: ID!
  $kind: CorpusTemplateOverrideKind!
) {
  clearCorpusTemplateOverride(corpusId: $corpusId, kind: $kind) {
    _id
    pipelineSettings {
      templateId
      cssOverrideRef
    }
  }
}

fragment basicDeployTargetFields on DeployTarget {
  _id
  name
  kind
  workspace
  config
  hasCredentials
  createdAt
  updatedAt
}

query getDeployTargets($workspaceId: ID) {
  deployTargets(workspaceId: $workspaceId) {
    ...basicDeployTargetFields
  }
}

mutation createDeployTarget($input: CreateDeployTargetInput!) {
  createDeployTarget(input: $input) {
    ...basicDeployTargetFields
  }
}

mutation updateDeployTarget($id: ID!, $input: UpdateDeployTargetInput!) {
  updateDeployTarget(id: $id, input: $input) {
    ...basicDeployTargetFields
  }
}

mutation deleteDeployTarget($id: ID!) {
  deleteDeployTarget(id: $id)
}

mutation startStaticDeploy(
  $corpusId: ID!
  $targetId: ID
  $dryRun: Boolean = false
) {
  startStaticDeploy(corpusId: $corpusId, targetId: $targetId, dryRun: $dryRun) {
    ...basicPipelineJobFields
  }
}
